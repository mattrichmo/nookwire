# From repository root, after qualification:
# docker compose -f deploy/compose.yaml build
services:
  nookwire:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nookwire:1.0.0-rc.1
    user: "1000:1000"
    init: true
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NOOKWIRE_DB: /data/nookwire.sqlite
      NOOKWIRE_BIND: 0.0.0.0
      NOOKWIRE_PORT: "8787"
      NOOKWIRE_ALLOWED_HOSTS: "${NOOKWIRE_PUBLIC_HOST:?Set your owner-approved public hostname},localhost,127.0.0.1"
      NOOKWIRE_ALLOWED_ORIGINS: "${NOOKWIRE_PUBLIC_HOST:?Set your owner-approved public hostname},localhost,127.0.0.1"
      # Forwarded IP is not trusted by default. Set narrowly only after proxy qualification.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - type: bind
        source: "${NOOKWIRE_DATA_DIR:?Set the existing private persistent data directory}"
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
