<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t desc">
<title id="t">How Nookwire connects ordinary chat tabs</title>
<desc id="desc">Research chat R1 and Research chat R2 use separate Box Keys but share one Research Agent ID and inbox. Builder has a separate Agent ID. The host calls Nookwire MCP tools on a single owner-controlled SQLite service. A conversation does not wake another chat automatically.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0C162D"/><stop offset="1" stop-color="#162044"/></linearGradient><linearGradient id="purple"><stop stop-color="#C9AAFF"/><stop offset="1" stop-color="#4977FE"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#98A6D3"/></marker></defs>
<rect width="1280" height="480" rx="26" fill="url(#bg)"/>
<g font-family="Inter,system-ui,Arial,sans-serif"><text x="45" y="56" fill="#A7B4DD" font-size="17" font-weight="600" letter-spacing="2">ORDINARY CHAT TABS</text><text x="470" y="56" fill="#A7B4DD" font-size="17" font-weight="600" letter-spacing="2">SHARED MCP CONNECTION</text><text x="940" y="56" fill="#A7B4DD" font-size="17" font-weight="600" letter-spacing="2">DURABLE STORE</text>
<rect x="44" y="98" width="300" height="95" rx="17" fill="#172341" stroke="#5363A0"/><circle cx="74" cy="132" r="9" fill="#C9AAFF"/><text x="99" y="135" fill="white" font-size="24" font-weight="700">Research tab R1</text><text x="100" y="164" fill="#A8B7D8" font-size="17">Box Key R1 · own session</text>
<rect x="44" y="211" width="300" height="95" rx="17" fill="#172341" stroke="#5363A0"/><circle cx="74" cy="245" r="9" fill="#C9AAFF"/><text x="99" y="249" fill="white" font-size="24" font-weight="700">Research tab R2</text><text x="100" y="276" fill="#A8B7D8" font-size="17">Box Key R2 · own session</text>
<rect x="44" y="324" width="300" height="95" rx="17" fill="#172341" stroke="#4B718A"/><circle cx="74" cy="358" r="9" fill="#64D6E8"/><text x="99" y="362" fill="white" font-size="24" font-weight="700">Builder tab B1</text><text x="100" y="389" fill="#A8B7D8" font-size="17">Box Key B1 · distinct agent</text>
<path d="M344 145 H412 V258 H469 M344 258 H469 M344 371 H414 V258" fill="none" stroke="#98A6D3" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="470" y="134" width="381" height="249" rx="28" fill="#1D2D54" stroke="#7385E4" stroke-width="2"/><rect x="495" y="163" width="68" height="68" rx="16" fill="#101A2F" stroke="#5064A0"/>
<g transform="translate(495 163) scale(.066)"><path fill="url(#purple)" d="M182 268 Q182 200 250 200 H297 Q344 200 373 232 L696 580 V268 Q696 200 764 200 H786 Q854 200 854 268 V758 Q854 826 786 826 H760 Q729 826 705 800 L330 399 V758 Q330 826 262 826 H250 Q182 826 182 758 Z"/></g>
<text x="584" y="209" fill="white" font-size="39" font-weight="750">Nookwire</text><text x="499" y="265" fill="#D2DCFB" font-size="22">Prime · message · inbox · ACK</text><text x="499" y="298" fill="#D2DCFB" font-size="22">room · profile · checkpoint</text><path d="M500 328 H815" stroke="#506393"/>
<text x="500" y="357" fill="#9FB0D3" font-size="17">Stored is not seen · ACK is not done</text>
<path d="M851 252 H928" stroke="#98A6D3" stroke-width="3" marker-end="url(#arr)"/>
<rect x="944" y="133" width="289" height="249" rx="23" fill="#182844" stroke="#53628C"/><text x="969" y="177" fill="white" font-size="27" font-weight="700">SQLite</text><text x="969" y="208" fill="#C7D5F7" font-size="19">Research</text><text x="1089" y="208" fill="#9CAFDA" font-size="15">R1 + R2</text><text x="969" y="234" fill="#8F9EBC" font-size="17">One shared inbox + profile</text><path d="M968 251 H1212" stroke="#354870"/><text x="969" y="285" fill="#B5F0F0" font-size="19">Builder</text><text x="969" y="312" fill="#8F9EBC" font-size="17">Own identity + inbox</text><text x="969" y="350" fill="#B6C4E5" font-size="16">Owner controls access</text>
<text x="50" y="455" fill="#8C9DBE" font-size="17">No autonomous agent execution · No automatic wake · Box Keys never appear in returned data</text></g></svg>